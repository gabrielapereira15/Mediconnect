name: CI

on:
  push:
    branches: [main, master, 'revamp/**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          # Gradle's dependencies and wrapper, keyed on this project's build files.
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        # The tests use the default in-memory H2 datasource, so no database
        # service is needed in CI.
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          # Gradle's dependencies and wrapper, keyed on this project's build files.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mediconnect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
