<!DOCTYPE html>
<!--
    Something went wrong, said in the design system's own words: which
    kind of wrong, and the way back.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${status}">Error</title>
</head>
<body>
<div layout:fragment="content" style="display: grid; place-items: center; flex: 1">
    <div class="mc-empty" style="max-width: 440px; text-align: center">
        <span class="mc-empty-icon"><i class="mc-i mc-i-alert mc-i-32" aria-hidden="true"></i></span>
        <h1 class="mc-empty-title" th:switch="${status}">
            <th:block th:case="403">[[#{error.403.title}]]</th:block>
            <th:block th:case="404">[[#{error.404.title}]]</th:block>
            <th:block th:case="*">[[#{error.other.title}]]</th:block>
        </h1>
        <p class="mc-empty-body" th:switch="${status}">
            <th:block th:case="403">[[#{error.403.body}]]</th:block>
            <th:block th:case="404">[[#{error.404.body}]]</th:block>
            <th:block th:case="*">[[#{error.message}]]</th:block>
        </p>
        <a th:href="@{/}" class="mc-btn mc-btn-primary mc-btn-md mc-btn-square">[[#{error.back}]]</a>
    </div>
</div>
</body>
</html>
