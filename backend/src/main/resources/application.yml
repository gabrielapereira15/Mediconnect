spring:
  application:
    name: mediconnect
  # Defaults to an in-memory H2 database so `gradlew bootRun` works on a fresh
  # clone with nothing installed. Use `--args='--spring.profiles.active=postgres'`
  # (or docker compose up) for a real Postgres — see the postgres profile below.
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:mediconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
      time: HH:mm:ss
  # Only start docker compose services when the postgres profile asks for them.
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      DoctorIdValid: DOCTOR_ID_VALID
      PatientIdValid: PATIENT_ID_VALID

springdoc:
  pathsToMatch: /api/**
  swagger-ui:
    path: /swagger-ui.html

mediconnect:
  fhir:
    # The address this server's FHIR resources are published under. It ends
    # up in every Bundle.entry.fullUrl, so a client that follows one has to
    # arrive back here.
    base-url: ${FHIR_BASE_URL:http://localhost:8080/fhir}
    organization-name: ${CLINIC_NAME:Mediconnect Clinic}
    # Health card identifier systems come from the Canadian URI Registry and
    # differ per province. Override for a real deployment; the defaults in
    # FhirProperties follow the Infoway naming pattern and should be
    # confirmed against the registry before anyone relies on them.

  # Where doctor photos are served from. Defaults to this server.
  photo-baseurl: ${PHOTO_BASEURL:http://localhost:8080}
  demo-data:
    # Seeds doctors, schedules, patients and appointments when the database is
    # empty, so a fresh clone has something to show.
    enabled: ${DEMO_DATA_ENABLED:true}
  auth:
    # Lifetime of a one-time passcode, and of the token issued after verifying.
    otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
    token-ttl-hours: ${TOKEN_TTL_HOURS:72}
    # Signing secret. A fixed development value so tokens survive a restart —
    # without it every backend restart silently invalidates the session and the
    # app starts getting 401s. The production profile requires a real one.
    token-secret: ${TOKEN_SECRET:mediconnect-local-development-secret-not-for-production}
    # In demo mode the passcode is returned in the response and logged, because
    # there is no mail provider wired up. Never enable this in production.
    expose-otp: ${EXPOSE_OTP:true}

---
# Real Postgres. `docker compose up -d` starts one matching these settings.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/mediconnect}
    username: ${JDBC_DATABASE_USERNAME:mediconnect}
    password: ${JDBC_DATABASE_PASSWORD:mediconnect}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

---
# Production: everything comes from the environment and nothing is exposed.
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

mediconnect:
  demo-data:
    enabled: false
  auth:
    expose-otp: false
    # No default: startup fails if TOKEN_SECRET is not set in production.
    token-secret: ${TOKEN_SECRET}
