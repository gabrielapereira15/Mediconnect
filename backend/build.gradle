plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.vegs'
version = '0.0.1-SNAPSHOT'

java.sourceCompatibility = '17'

bootRun {
    environment SPRING_PROFILES_ACTIVE: environment.SPRING_PROFILES_ACTIVE ?: 'local'
}

repositories {
    mavenCentral()
}

// HAPI 7.x is the Jakarta-based line, which matches Spring Boot 3.
ext {
    hapiFhirVersion = '7.4.5'
    hapiFhirCoreVersion = '6.3.23'
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-validation')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    // H2 is the zero-setup default so `gradlew bootRun` works on a fresh
    // clone; Postgres is used by the `postgres` profile and in production.
    runtimeOnly('com.h2database:h2')
    runtimeOnly('org.postgresql:postgresql')
    implementation('io.github.wimdeblauwe:error-handling-spring-boot-starter:4.5.0')
    implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
    implementation('nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect')
    // The password hasher only. Not spring-boot-starter-security: that
    // would put a filter chain in front of the mobile API too, which has
    // its own token check, and securing the back office is no reason to
    // re-secure something that is already secured differently.
    implementation('org.springframework.security:spring-security-crypto:6.3.4')
    implementation('org.webjars:bootstrap:5.3.3')
    implementation('org.webjars.npm:htmx.org:2.0.3')
    implementation('org.webjars.npm:flatpickr:4.6.13')
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0')

    // HAPI's R4 model classes, used to build and serialise FHIR resources.
    // Only the structures and the validator — not the HAPI JPA server, which
    // would bring its own persistence layer and duplicate the one here.
    implementation("ca.uhn.hapi.fhir:hapi-fhir-structures-r4:$hapiFhirVersion")
    implementation("ca.uhn.hapi.fhir:hapi-fhir-validation:$hapiFhirVersion")
    testImplementation("ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:$hapiFhirVersion")
    // HAPI looks up its cache implementation through the service loader and
    // ships none by default, so the validator fails to start without one.
    testImplementation("ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:$hapiFhirVersion")
    // Lets the validator load an IG published as a .tgz package, so the
    // conformance tests do not need network access in CI.
    testImplementation("ca.uhn.hapi.fhir:org.hl7.fhir.utilities:$hapiFhirCoreVersion")
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor('org.projectlombok:lombok')
    developmentOnly('org.springframework.boot:spring-boot-devtools')
    developmentOnly('org.springframework.boot:spring-boot-docker-compose')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
}

tasks.withType(Test) {
    useJUnitPlatform()
}
